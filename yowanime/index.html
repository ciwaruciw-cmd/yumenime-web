<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="Yumenime — Watch anime online in HD for free with the fastest updates." />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yumenime" />
    <meta name="application-name" content="Yumenime" />

    <!-- DNS prefetch for image CDNs and APIs -->
    <link rel="dns-prefetch" href="https://cdn.myanimelist.net" />
    <link rel="dns-prefetch" href="https://cdn.anime-planet.com" />
    <link rel="dns-prefetch" href="https://graphql.anilist.co" />
    <link rel="preconnect" href="https://graphql.anilist.co" />
    <link rel="dns-prefetch" href="https://media.kitsu.app" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Google Fonts: Inter (display=swap → non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    </noscript>

    <title>Yumenime — HD Anime Streaming</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
